name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ma3000
          POSTGRES_PASSWORD: ma3000
          POSTGRES_DB: ma3000
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ma3000" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test (API against real PostgreSQL and Redis)
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://ma3000:ma3000@localhost:5432/ma3000
          REDIS_URL: redis://localhost:6379
        run: |
          node dist/main.js &
          for i in $(seq 1 20); do curl -sf localhost:3000/api/health && exit 0; sleep 1; done
          exit 1
